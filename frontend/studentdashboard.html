<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>InternConnect | Student Dashboard</title>

    <link rel="stylesheet" href="css/style.css">


    <style>

        .dashboard {

            width: 90%;
            max-width: 1200px;
            margin: auto;
            padding: 30px 0;

        }


        .welcome {

            background: linear-gradient(135deg, #0d6efd, #4f9dff);
            color: white;
            padding: 35px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,.15);

        }


        .welcome h2 {

            font-size: 32px;
            margin-bottom: 10px;

        }


        .welcome p {

            font-size: 16px;

        }



        .stats {

            display: grid;
            grid-template-columns: repeat(auto-fit,minmax(220px,1fr));
            gap: 20px;
            margin-bottom: 30px;

        }



        .stat-card {

            background: white;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0,0,0,.08);

        }



        .stat-card h3 {

            color: #0d6efd;
            margin-bottom: 10px;

        }



        .stat-card h1 {

            font-size: 38px;
            margin: 0;

        }



        .quick-actions {

            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 30px;

        }



        .quick-actions a {

            background: #0d6efd;
            color: white;
            text-decoration: none;
            padding: 14px 25px;
            border-radius: 10px;
            font-weight: 600;
            transition: .3s;

        }



        .quick-actions a:hover {

            background: #0056d2;

        }



        .logout-btn {

            background: #dc3545;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;

        }



        .logout-btn:hover {

            background: #b02a37;

        }


    </style>

</head>



<body>


<header>

    <h1>🎓 InternConnect Student Dashboard</h1>

    <button class="logout-btn" onclick="logout()">
        Logout
    </button>

</header>



<div class="dashboard">



    <!-- Welcome Section -->

    <div class="welcome">

        <h2>
            Welcome, <span id="studentName">Student</span> 👋
        </h2>

        <p>
            Find internships, apply to opportunities and track your applications.
        </p>

    </div>





    <!-- Statistics Cards -->

    <div class="stats">



        <div class="stat-card">

            <h3>
                Available Internships
            </h3>

            <h1 id="internshipCount">
                0
            </h1>

        </div>




        <div class="stat-card">

            <h3>
                My Applications
            </h3>

            <h1 id="applicationCount">
                0
            </h1>

        </div>




        <div class="stat-card">

            <h3>
                Shortlisted
            </h3>

            <h1 id="shortlistedCount">
                0
            </h1>

        </div>



    </div>





    <!-- Quick Actions -->

    <div class="quick-actions">


        <a href="internships.html">
            💼 Browse Internships
        </a>



        <a href="myapplications.html">
            📄 My Applications
        </a>



    </div>



</div>




<script src="js/studentdashboard.js"></script>


</body>

</html>
