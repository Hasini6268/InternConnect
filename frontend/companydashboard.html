<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InternConnect | Company Dashboard</title>

    <link rel="stylesheet" href="css/style.css">

    <style>

        .dashboard{
            width:90%;
            max-width:1200px;
            margin:auto;
            padding:30px 0;
        }

        .welcome{
            background:linear-gradient(135deg,#0d6efd,#4f9dff);
            color:white;
            padding:35px;
            border-radius:15px;
            margin-bottom:30px;
            box-shadow:0 10px 25px rgba(0,0,0,.15);
        }

        .welcome h2{
            font-size:32px;
            margin-bottom:10px;
        }

        .stats{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
            gap:20px;
            margin-bottom:35px;
        }

        .stat-card{
            background:white;
            padding:25px;
            border-radius:15px;
            text-align:center;
            box-shadow:0 8px 20px rgba(0,0,0,.08);
            transition:.3s;
        }

        .stat-card:hover{
            transform:translateY(-6px);
        }

        .stat-card h3{
            color:#0d6efd;
            font-size:18px;
            margin-bottom:10px;
        }

        .stat-card h1{
            font-size:38px;
            color:#333;
        }

        .card{
            background:white;
            padding:30px;
            border-radius:15px;
            box-shadow:0 8px 20px rgba(0,0,0,.08);
            margin-bottom:30px;
        }

        .card h2{
            color:#0d6efd;
            margin-bottom:20px;
        }

    </style>

</head>

<body>

<header>

    <h1>🏢 InternConnect Company Dashboard</h1>

    <button onclick="logout()">Logout</button>

</header>

<div class="dashboard">

<div class="welcome">

<h2>Welcome Company!</h2>

<p>
Manage internships, review applicants and recruit talented students.
</p>

</div>

<div class="stats">

<div class="stat-card">
<h3>Posted Internships</h3>
<h1 id="internshipCount">0</h1>
</div>

<div class="stat-card">
<h3>Applications</h3>
<h1 id="applicationCount">0</h1>
</div>

<div class="stat-card">
<h3>Active Jobs</h3>
<h1 id="activeCount">0</h1>
</div>

</div>

<div class="card">

<h2>📌 Post a New Internship</h2>

<form id="internshipForm">

<input
type="text"
id="title"
placeholder="Internship Title"
required>

<textarea
id="description"
placeholder="Internship Description"
required></textarea>

<input
type="text"
id="skills"
placeholder="Skills (comma separated)"
required>

<input
type="text"
id="location"
placeholder="Location"
required>

<input
type="text"
id="duration"
placeholder="Duration"
required>

<input
type="text"
id="stipend"
placeholder="Stipend"
required>

<select id="mode">

<option value="Onsite">Onsite</option>
<option value="Hybrid">Hybrid</option>
<option value="Remote">Remote</option>

</select>

<input
type="date"
id="lastDate"
required>

<button type="submit">
🚀 Post Internship
</button>

</form>

</div>

<div class="card">

<h2>💼 My Internships</h2>

<div id="internshipContainer">

Loading internships...

</div>

</div>

</div>

<script src="js/companydashboard.js"></script>

</body>

</html>
