<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>InternConnect | Apply Internship</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>


    <div class="login-container">


        <div class="login-card">


            <h2>
                Apply For Internship 🚀
            </h2>


            <p>
                Submit your application details
            </p>



            <form id="applicationForm">


                <input
                    type="text"
                    id="phone"
                    placeholder="Phone Number"
                    required
                >



                <input
                    type="text"
                    id="college"
                    placeholder="College Name"
                    required
                >



                <input
                    type="text"
                    id="skills"
                    placeholder="Skills (Java, Python, React)"
                    required
                >



                <textarea
                    id="coverLetter"
                    placeholder="Write Cover Letter"
                    rows="5"
                    required
                ></textarea>



                <label>
                    Upload Resume
                </label>


                <input
                    type="file"
                    id="resume"
                    accept=".pdf,.doc,.docx"
                    required
                >



                <button type="submit">

                    Submit Application

                </button>


            </form>


            <br>


            <a href="internships.html">

                ← Back to Internships

            </a>



        </div>


    </div>



<script src="js/apply.js"></script>


</body>

</html>
